plugins {
    id 'java-library'
}

group = 'com.oneverse'
version = '0.1.0'
description = 'Private server-side Lazers Signal Protocol v1 SDK'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { manifest { attributes('Implementation-Title': 'Lazers Java SDK', 'Implementation-Version': project.version) } }